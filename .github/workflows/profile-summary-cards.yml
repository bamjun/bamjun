name: Download GitHub Profile Summary Cards

on:
  workflow_dispatch:

  schedule:
    # 매일 한국시간 오전 9시
    # GitHub Actions cron은 UTC 기준
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: github-profile-summary-cards
  cancel-in-progress: true

jobs:
  download-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download profile cards
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="profile-summary-card-output/aura"
          TEMP_DIR="$(mktemp -d)"

          BASE_URL="https://github-profile-summary-cards.vercel.app/api/cards"

          curl --fail --location --retry 3 \
            "${BASE_URL}/profile-details?username=bamjun&theme=aura" \
            --output "${TEMP_DIR}/0-profile-details.svg"

          curl --fail --location --retry 3 \
            "${BASE_URL}/repos-per-language?username=bamjun&theme=aura" \
            --output "${TEMP_DIR}/1-repos-per-language.svg"

          curl --fail --location --retry 3 \
            "${BASE_URL}/most-commit-language?username=bamjun&theme=aura" \
            --output "${TEMP_DIR}/2-most-commit-language.svg"

          curl --fail --location --retry 3 \
            "${BASE_URL}/stats?username=bamjun&theme=aura" \
            --output "${TEMP_DIR}/3-stats.svg"

          curl --fail --location --retry 3 \
            "${BASE_URL}/productive-time?username=bamjun&theme=aura&utcOffset=9" \
            --output "${TEMP_DIR}/4-productive-time.svg"

          # 정상적인 SVG 파일인지 확인
          for file in "${TEMP_DIR}"/*.svg; do
            if ! grep -q "<svg" "$file"; then
              echo "::error file=$file::Downloaded file is not a valid SVG"
              exit 1
            fi
          done

          mkdir -p "${OUTPUT_DIR}"
          cp "${TEMP_DIR}"/*.svg "${OUTPUT_DIR}/"

          echo "Downloaded cards:"
          ls -lh "${OUTPUT_DIR}"

      - name: Commit downloaded cards
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output/aura

          if git diff --cached --quiet; then
            echo "No card changes."
            exit 0
          fi

          git commit -m "chore: update GitHub profile cards"
          git push
