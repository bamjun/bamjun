name: Download GitHub Profile Summary Cards

on:
  workflow_dispatch:

  schedule:
    # 매일 한국시간 오전 9시
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: github-profile-summary-cards
  cancel-in-progress: true

jobs:
  download-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download profile cards
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="profile-summary-card-output/aura"
          TEMP_DIR="$(mktemp -d)"
          BASE_URL="https://github-profile-summary-cards.vercel.app/api/cards"

          download_card() {
            local endpoint="$1"
            local filename="$2"
            local extra_query="${3:-}"
            local temp_file="${TEMP_DIR}/${filename}"

            for attempt in 1 2 3 4 5; do
              echo "Downloading ${filename} — attempt ${attempt}/5"

              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --connect-timeout 15 \
                --max-time 60 \
                --user-agent "bamjun-profile-card-downloader" \
                "${BASE_URL}/${endpoint}?username=bamjun&theme=aura${extra_query}" \
                --output "${temp_file}"

              # SVG 형식 확인
              if ! grep -qi "<svg" "${temp_file}"; then
                echo "Invalid SVG response."
              # API가 반환한 오류 SVG인지 확인
              elif grep -Eqi \
                "ERROR|temporarily rate limited|rate.?limited|try again in a few minutes" \
                "${temp_file}"; then
                echo "Rate-limit error SVG received."
              else
                echo "Valid card downloaded: ${filename}"
                return 0
              fi

              rm -f "${temp_file}"

              if [[ "${attempt}" -lt 5 ]]; then
                echo "Waiting 30 seconds before retry..."
                sleep 30
              fi
            done

            echo "::error::Unable to download a valid ${filename}"
            return 1
          }

          download_card \
            "profile-details" \
            "0-profile-details.svg"

          sleep 5

          download_card \
            "repos-per-language" \
            "1-repos-per-language.svg"

          sleep 5

          download_card \
            "most-commit-language" \
            "2-most-commit-language.svg"

          sleep 5

          download_card \
            "stats" \
            "3-stats.svg"

          sleep 5

          download_card \
            "productive-time" \
            "4-productive-time.svg" \
            "&utcOffset=9"

          # 5개가 전부 정상이어야 기존 파일을 교체
          mkdir -p "${OUTPUT_DIR}"
          cp "${TEMP_DIR}"/*.svg "${OUTPUT_DIR}/"

          echo "Downloaded cards:"
          ls -lh "${OUTPUT_DIR}"

      - name: Commit downloaded cards
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output/aura

          if git diff --cached --quiet; then
            echo "No card changes."
            exit 0
          fi

          git commit -m "chore: update GitHub profile cards"
          git push
